name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: propfirmsquad
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URI: postgres://postgres@localhost:5432/propfirmsquad
      PAYLOAD_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. package.json declares
      # "packageManager": "pnpm@11.20.0", and specifying both makes
      # action-setup fail with ERR_PNPM_BAD_PM_VERSION. Letting it read
      # packageManager also keeps CI on the exact version used locally.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
